name: Claude · Auto PR Description

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  describe:
    # Only run if PR body is empty / has a template placeholder
    if: |
      github.event.pull_request.body == null ||
      github.event.pull_request.body == '' ||
      contains(github.event.pull_request.body, '<!-- claude-pr-description -->')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude write PR description
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Generate a pull request description for the SOZO Review project
            and update the PR body via `gh pr edit`.

            ## Context to read first

            - `CLAUDE.md` — project overview
            - `docs/superpowers/plans/phase*-status.md` — what was done per phase
            - The actual diff of this PR

            ## The PR description structure

            Use this exact 5-section markdown template, filled with content
            inferred from the diff. Write 日本語 if the PR mostly touches UI
            strings; 中文 / 英文 otherwise. Keep total length under 400 words.

            ```markdown
            ## 概要 / Summary
            <1-2 sentences: what user-visible change this PR makes>

            ## 主な変更 / What changed
            - <bullet 1 — file or feature>
            - <bullet 2>
            - <bullet 3>

            ## SPEC / Design refs
            <link to spec sections this PR addresses, e.g. SPEC §A5, ADR-005>

            ## Test plan
            - [ ] <how to verify in dev / what tests cover this>
            - [ ] <browser walkthrough step if UI changed>

            ## Risks / Known gaps
            <any incomplete items deferred to a follow-up PR>
            ```

            ## How to update

            1. Generate the description string.
            2. Run `gh pr edit ${{ github.event.pull_request.number }} --body "<description>"`
               to set it. Use a HEREDOC to preserve newlines.
            3. Post a short PR comment: "🤖 PR description generated by Claude — feel free to edit."

            Do NOT overwrite if author has already written their own description
            (the `if` clause already guards this, but double-check).
